[package]
name = "hydrogen_src"
version = "0.1.0"
edition = "2024"

[features]
default = ["rayon"]
rayon = ["dep:rayon"]

[dependencies]
directories = "6"
i24 = "1"
include_dir = "0.7"
rayon = { version = "1", optional = true }
reqwest = { version = "0.13", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
wavers = "1"
zip = "8"
